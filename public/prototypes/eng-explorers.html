<!doctype html>
<!--
  PROTOTYPE — Engineering project EXPLORERS (accordion replacements).
  Throwaway, not wired into Astro. View on the dev server at
  /prototypes/eng-explorers.html (images are root-relative /Assets/...).

  Five interfaces, one shared selection + one shared viewport component, all
  skinned in the proposed "synth" tokens (see eng-synth-system.html §02):
    1 DIAL      rotary detent selector (drag / wheel / arrows), the Nob callback
    2 INDEX     spec-sheet list + fixed viewport (hover previews, click pins)
    3 RACK      stacked rack units, click to pull one out
    4 SEQ       step-sequencer keys + transport (optional attract "play")
    5 TIME      logbook timeline, scrub a playhead through the years

  Rules every explorer follows (what the accordion breaks):
    - hit targets never move under a still cursor
    - names readable at rest (no hover-to-discover)
    - hover = preview, click/Enter = select (selection persists)
    - one stable viewport that updates in place
    - full keyboard path; no idle motion; reduced-motion = instant swaps

  Toolbar: 1–5 switch mode · D toggles dark · 4 / 12 toggles a stress-test dataset.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eng Explorers</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #ecebe7; --panel: #e2e1dc; --panel-2: #d6d5cf;
  --ink: #161613; --ink-2: #4f4e48; --ink-3: #8a8982;
  --line: rgba(22, 22, 19, 0.13); --line-2: rgba(22, 22, 19, 0.3);
  --screen: #11110f; --screen-ink: #e7e5de;
  --signal: #f5a045; --ok: #6fbf6a;
  --glow: 0 0 0 1px rgba(245, 160, 69, 0.45), 0 0 10px rgba(245, 160, 69, 0.55);
  --f-display: 'Archivo', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, monospace;
  --ease-detent: cubic-bezier(0.2, 0, 0, 1);
  --ease-travel: cubic-bezier(0.45, 0, 0.15, 1);
  --t-tap: 90ms; --t-move: 180ms; --t-panel: 280ms;
  --hair: 1px solid var(--line); --hair-2: 1px solid var(--line-2);
  --knob-body: #d9d8d2; --knob-cap: #f1f0ec;
}
[data-scheme='dark'] {
  --bg: #141412; --panel: #1c1c19; --panel-2: #262622;
  --ink: #e7e5de; --ink-2: #a9a79f; --ink-3: #6f6d66;
  --line: rgba(231, 229, 222, 0.11); --line-2: rgba(231, 229, 222, 0.26);
  --screen: #0a0a09;
  --knob-body: #22221f; --knob-cap: #2e2e2a;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-display); -webkit-font-smoothing: antialiased; min-height: 100vh; transition: background var(--t-panel) linear, color var(--t-panel) linear; }
button { font: inherit; color: inherit; }
.mono, .label { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.label { color: var(--ink-3); }
.led { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line-2); flex: none; transition: background var(--t-tap) linear, box-shadow var(--t-tap) linear; }
.led.on, .is-on > .led, .is-on .led.sel { background: var(--signal); box-shadow: var(--glow); }
.led.ok { background: var(--ok); box-shadow: 0 0 8px rgba(111, 191, 106, 0.6); }

.key {
  --k-bg: var(--panel);
  appearance: none; border: 1px solid var(--line-2); background: var(--k-bg);
  display: inline-flex; align-items: center; gap: 9px; height: 34px; padding: 0 13px; border-radius: 2px;
  font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink);
  cursor: pointer; text-decoration: none; white-space: nowrap;
  box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.35);
  transition: background var(--t-tap) linear, transform var(--t-tap) var(--ease-detent), box-shadow var(--t-tap) linear;
}
[data-scheme='dark'] .key { box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05); }
.key:hover { --k-bg: var(--panel-2); }
.key:active { transform: translateY(1px); }
.key:focus-visible, .focusable:focus-visible { outline: 1px solid var(--signal); outline-offset: 3px; }
.key.dark { --k-bg: var(--ink); color: var(--bg); border-color: var(--ink); }
.key.dark:hover { --k-bg: var(--ink-2); }
.key[aria-pressed='true'] .led { background: var(--signal); box-shadow: var(--glow); }
.key kbd { font: inherit; color: var(--ink-3); }

/* ---------- toolbar ---------- */
.bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: stretch; gap: 0; height: 52px; border-bottom: var(--hair); background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(8px); }
.bar .brand { display: flex; align-items: center; gap: 10px; padding: 0 20px; border-right: var(--hair); font-weight: 600; font-stretch: 118%; font-size: 13px; }
.modes { display: flex; }
.modes button { appearance: none; border: 0; border-right: var(--hair); background: transparent; padding: 0 18px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.1em; color: var(--ink-2); transition: background var(--t-tap) linear, color var(--t-tap) linear; }
.modes button:hover { background: var(--panel); color: var(--ink); }
.modes button[aria-selected='true'] { color: var(--ink); background: var(--panel); }
.modes button kbd { font: inherit; color: var(--ink-3); }
.bar .right { margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 0 16px; }
@media (max-width: 900px) { .bar { height: auto; flex-wrap: wrap; } .modes { overflow-x: auto; width: 100%; order: 3; border-top: var(--hair); } .modes button { height: 44px; } .bar .brand { height: 48px; } }

main { max-width: 1400px; margin: 0 auto; padding: 28px 24px 80px; }
.head { display: grid; grid-template-columns: 1fr 320px; gap: 32px; align-items: end; margin-bottom: 22px; padding-bottom: 16px; border-bottom: var(--hair-2); }
.head h1 { margin: 0; font-weight: 600; font-stretch: 122%; font-size: clamp(26px, 3vw, 40px); line-height: 1; letter-spacing: -0.01em; }
.head p { margin: 8px 0 0; color: var(--ink-2); max-width: 70ch; font-size: 14.5px; line-height: 1.55; }
.score { display: grid; grid-template-columns: 1fr auto; gap: 5px 14px; }
.score .bars { display: flex; gap: 3px; }
.score .bars i { width: 14px; height: 6px; background: var(--panel-2); }
.score .bars i.on { background: var(--ink); }
@media (max-width: 900px) { .head { grid-template-columns: 1fr; } }

/* ---------- shared viewport ---------- */
.vp { border: var(--hair-2); background: var(--panel); display: grid; grid-template-rows: auto 1fr; position: relative; min-width: 0; }
.vp-media { position: relative; aspect-ratio: 16 / 10; margin: 12px 12px 0; overflow: hidden; background: var(--screen); border: var(--hair); }
.vp-layer { position: absolute; inset: 0; }
.vp-layer img, .vp-layer video { width: 100%; height: 100%; object-fit: cover; display: block; }
.vp-hud { position: absolute; left: 10px; top: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; z-index: 2; }
.vp-hud span { background: rgba(10, 10, 9, 0.72); color: var(--screen-ink); padding: 4px 7px; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.08em; }
.vp-hud em { font-style: normal; color: var(--signal); }
.vp-hud .pv { opacity: 0; transition: opacity var(--t-tap) linear; }
.vp.is-preview .vp-hud .pv { opacity: 1; }
.vp-meta { padding: 14px 16px 16px; display: grid; gap: 10px; align-content: start; }
.vp-eyebrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.vp-eyebrow .sep { width: 16px; height: 1px; background: var(--line-2); }
.vp-title { margin: 0; font-weight: 600; font-stretch: 120%; font-size: clamp(24px, 2.4vw, 34px); line-height: 1; letter-spacing: -0.01em; }
.vp-title small { font-family: var(--f-mono); font-size: 11px; font-weight: 400; letter-spacing: 0.08em; color: var(--ink-3); margin-left: 10px; vertical-align: 6px; font-stretch: 100%; text-transform: uppercase; }
.vp-desc { margin: 0; color: var(--ink-2); font-size: 14.5px; line-height: 1.55; max-width: 62ch; }
.vp-spec { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); border-top: var(--hair); border-left: var(--hair); }
.vp-spec div { border-right: var(--hair); border-bottom: var(--hair); padding: 7px 9px; }
.vp-spec b { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 12px; margin-top: 3px; color: var(--ink); text-transform: none; letter-spacing: 0.02em; }
.vp-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.corner { position: absolute; width: 10px; height: 10px; border: 1px solid var(--ink); pointer-events: none; }
.corner.c-tl { left: -6px; top: -6px; border-right: 0; border-bottom: 0; }
.corner.c-br { right: -6px; bottom: -6px; border-left: 0; border-top: 0; }

/* ---------- 1 DIAL ---------- */
.dial-wrap { display: grid; grid-template-columns: minmax(320px, 440px) 1fr; gap: 28px; align-items: start; }
@media (max-width: 960px) { .dial-wrap { grid-template-columns: 1fr; } }
.dial-panel { border: var(--hair-2); background: var(--panel); padding: 18px; display: grid; gap: 16px; justify-items: center; position: relative; }
.dial-svg { width: 100%; max-width: 380px; aspect-ratio: 1; display: block; touch-action: none; user-select: none; }
.dial-svg .tick { stroke: var(--ink-3); stroke-width: 1; }
.dial-svg .det { stroke: var(--ink); stroke-width: 2; }
.dial-svg .lbl { font-family: var(--f-mono); font-size: 11px; fill: var(--ink-3); letter-spacing: 0.06em; cursor: pointer; }
.dial-svg .lbl.on { fill: var(--ink); font-weight: 700; }
.dial-svg .dled { fill: var(--panel-2); stroke: var(--line-2); transition: fill var(--t-tap) linear; }
.dial-svg .dled.on { fill: var(--signal); filter: drop-shadow(0 0 4px rgba(245, 160, 69, 0.9)); stroke: none; }
.dial-svg .body { fill: var(--knob-body); stroke: var(--line-2); }
.dial-svg .cap { fill: var(--knob-cap); }
.dial-svg .knurl { stroke: var(--line-2); stroke-width: 1.2; }
.dial-svg .ind { fill: var(--signal); }
.dial-svg #rot { transform-box: view-box; transform-origin: 0 0; cursor: grab; }
.dial-svg.dragging #rot { cursor: grabbing; }
.dial-svg #rot.snap { transition: transform var(--t-move) var(--ease-detent); }
.dial-svg:focus-visible { outline: 1px solid var(--signal); outline-offset: 4px; }
.seg { font-family: var(--f-mono); background: var(--screen); color: var(--screen-ink); padding: 10px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; width: 100%; border-radius: 2px; }
.seg .big { font-size: 28px; color: var(--signal); letter-spacing: 0.04em; text-shadow: 0 0 12px rgba(245, 160, 69, 0.45); }
.seg .nm { font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg .sm { font-size: 10px; letter-spacing: 0.1em; color: #8d8b84; }
.hint { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }

/* ---------- 2 INDEX ---------- */
.idx-wrap { display: grid; grid-template-columns: minmax(380px, 1fr) minmax(0, 1.25fr); gap: 28px; align-items: start; }
@media (max-width: 960px) { .idx-wrap { grid-template-columns: 1fr; } }
.idx-sticky { position: sticky; top: 76px; }
.idx-head, .idx-row { display: grid; grid-template-columns: 44px 1fr 120px 92px 18px; align-items: center; gap: 12px; padding: 0 12px; }
.idx-head { height: 34px; border-bottom: var(--hair-2); }
.idx-head button { appearance: none; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; }
.idx-head button[aria-pressed='true'] { color: var(--ink); }
.idx-list { list-style: none; margin: 0; padding: 0; }
.idx-row { height: 58px; border-bottom: var(--hair); cursor: pointer; position: relative; transition: background var(--t-tap) linear; }
.idx-row .nm { font-weight: 600; font-stretch: 118%; font-size: 21px; color: var(--ink-3); transition: color var(--t-tap) linear; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.idx-row:hover, .idx-row.is-preview { background: var(--panel); }
.idx-row:hover .nm, .idx-row.is-preview .nm, .idx-row.is-on .nm { color: var(--ink); }
.idx-row.is-on::before { content: ''; position: absolute; left: 0; top: -1px; bottom: -1px; width: 2px; background: var(--ink); }
.idx-row:focus-visible { outline: 1px solid var(--signal); outline-offset: -1px; }
@media (max-width: 600px) { .idx-head, .idx-row { grid-template-columns: 36px 1fr 80px 14px; } .idx-head > :nth-child(3), .idx-row > :nth-child(3) { display: none; } }

/* ---------- 3 RACK ---------- */
.rack { position: relative; padding: 0 28px; }
.rack::before, .rack::after { content: ''; position: absolute; top: 0; bottom: 0; width: 18px; background: repeating-linear-gradient(180deg, transparent 0 14px, var(--line-2) 14px 22px, transparent 22px 44px), var(--panel); border: var(--hair); }
.rack::before { left: 0; } .rack::after { right: 0; }
.unit { border: var(--hair-2); background: linear-gradient(180deg, var(--panel), color-mix(in srgb, var(--panel) 80%, var(--bg))); margin-bottom: 6px; }
.unit-hd { appearance: none; border: 0; background: none; width: 100%; display: grid; grid-template-columns: 22px 46px minmax(140px, 220px) 1fr 160px 120px 20px; align-items: center; gap: 12px; height: 72px; padding: 0 14px; cursor: pointer; text-align: left; }
.unit-hd .screw { width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, var(--line-2), var(--panel-2)); box-shadow: inset 0 0 0 1px var(--line-2); }
.unit-hd .nm { font-weight: 600; font-stretch: 118%; font-size: 22px; }
.unit-hd .ds { color: var(--ink-2); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.unit-hd .thumb { height: 48px; border: var(--hair); background-size: cover; background-position: center; filter: grayscale(1); opacity: 0.7; transition: filter var(--t-move) linear, opacity var(--t-move) linear; }
.unit-hd:hover .thumb, .unit.is-on .unit-hd .thumb { filter: none; opacity: 1; }
.unit-hd .chev { font-family: var(--f-mono); color: var(--ink-3); transition: transform var(--t-move) var(--ease-detent); }
.unit.is-on .unit-hd .chev { transform: rotate(90deg); color: var(--ink); }
.unit-hd:focus-visible { outline: 1px solid var(--signal); outline-offset: -2px; }
.unit-bd { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--t-panel) var(--ease-travel); }
.unit.is-on .unit-bd { grid-template-rows: 1fr; }
.unit-bd > div { overflow: hidden; }
.unit-bd .vp { margin: 0 14px 14px 92px; grid-template-columns: 1.3fr 1fr; grid-template-rows: auto; }
.unit-bd .vp .vp-media { margin: 12px; }
@media (max-width: 900px) { .unit-hd { grid-template-columns: 22px 36px 1fr 20px; } .unit-hd .ds, .unit-hd .st, .unit-hd .thumb { display: none; } .unit-bd .vp { margin: 0 10px 10px; grid-template-columns: 1fr; } }

/* ---------- 4 SEQ ---------- */
.seq { --n: 8; display: grid; gap: 16px; }
.seq .vp { grid-template-columns: 1.4fr 1fr; grid-template-rows: auto; }
.seq .vp .vp-media { margin: 12px; }
@media (max-width: 900px) { .seq .vp { grid-template-columns: 1fr; } }
.transport { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.transport .seg { width: auto; grid-template-columns: auto auto; }
.steps { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 8px; }
.playhead { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 8px; margin-bottom: 6px; }
.playhead span { display: flex; justify-content: center; }
.step { appearance: none; position: relative; aspect-ratio: 1 / 0.9; border: 1px solid var(--line-2); background: var(--panel); border-radius: 2px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; cursor: pointer; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.1); transition: background var(--t-tap) linear, transform var(--t-tap) var(--ease-detent); min-width: 0; }
.step:hover { background: var(--panel-2); }
.step:active { transform: translateY(1px); }
.step .no { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); display: flex; justify-content: space-between; align-items: center; }
.step .nm { font-weight: 600; font-stretch: 112%; font-size: clamp(12px, 1.3vw, 17px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step.is-on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.step.is-on .no { color: color-mix(in srgb, var(--bg) 60%, transparent); }
.step.empty { background: transparent; border-style: dashed; cursor: default; box-shadow: none; color: var(--ink-3); }
.step:focus-visible { outline: 1px solid var(--signal); outline-offset: 3px; }
@media (max-width: 700px) { .steps, .playhead { grid-template-columns: repeat(4, 1fr); } .playhead { display: none; } }

/* ---------- 5 TIME ---------- */
.tl { border: var(--hair-2); background: var(--panel); padding: 0 0 8px; position: relative; user-select: none; overflow-x: clip; }
.tl-axis { position: relative; height: 40px; margin-left: 170px; margin-right: 24px; border-bottom: var(--hair-2); }
.tl-axis .q { position: absolute; bottom: 0; width: 1px; height: 6px; background: var(--ink-3); }
.tl-axis .y { position: absolute; bottom: 0; width: 1px; height: 14px; background: var(--ink); }
.tl-axis .y span { position: absolute; left: 6px; bottom: 6px; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; }
.tl-lanes { position: relative; }
.tl-lane { display: grid; grid-template-columns: 170px 1fr 24px; height: 40px; align-items: center; border-bottom: var(--hair); cursor: pointer; }
.tl-lane:focus-visible { outline: 1px solid var(--signal); outline-offset: -1px; }
.tl-lane .lab { display: flex; gap: 10px; align-items: center; padding-left: 14px; font-weight: 600; font-stretch: 112%; font-size: 15px; color: var(--ink-3); white-space: nowrap; overflow: hidden; }
.tl-lane.is-on .lab, .tl-lane:hover .lab, .tl-lane.lit .lab { color: var(--ink); }
.tl-lane .lab .mono { font-weight: 400; color: var(--ink-3); }
.tl-track { position: relative; height: 100%; }
.tl-bar { position: absolute; top: 13px; height: 14px; background: var(--ink-3); transition: background var(--t-tap) linear; }
.tl-bar.ongoing { background: linear-gradient(90deg, var(--ink-3) calc(100% - 28px), transparent), repeating-linear-gradient(90deg, var(--ink-3) 0 3px, transparent 3px 6px); }
.tl-lane.lit .tl-bar { background: var(--ink); }
.tl-lane.lit .tl-bar.ongoing { background: linear-gradient(90deg, var(--ink) calc(100% - 28px), transparent), repeating-linear-gradient(90deg, var(--ink) 0 3px, transparent 3px 6px); }
.tl-lane.is-on .tl-bar { box-shadow: 0 0 0 1px var(--bg), 0 0 0 2px var(--signal); }
.tl-now { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed var(--signal); pointer-events: none; }
.tl-now span { position: absolute; top: -18px; left: -14px; font-family: var(--f-mono); font-size: 10px; color: var(--signal); letter-spacing: 0.1em; }
.tl-head { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px solid var(--ink); pointer-events: none; opacity: 0; transition: opacity var(--t-tap) linear; }
.tl.scrubbing .tl-head { opacity: 1; }
.tl-head span { position: absolute; top: 4px; left: 6px; background: var(--ink); color: var(--bg); padding: 3px 6px; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.08em; white-space: nowrap; }
.tl-grid { position: absolute; inset: 0 24px 0 170px; pointer-events: none; }
.tl-grid i { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
.time-wrap { display: grid; gap: 20px; }
.time-wrap .vp { grid-template-columns: 1.4fr 1fr; grid-template-rows: auto; }
.time-wrap .vp .vp-media { margin: 12px; }
@media (max-width: 900px) { .time-wrap .vp { grid-template-columns: 1fr; } .tl-axis, .tl-grid { margin-left: 110px; left: 110px; } .tl-lane { grid-template-columns: 110px 1fr 12px; } .tl-lane .lab .mono { display: none; } }

.note { margin-top: 26px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1px; background: var(--line); border: var(--hair); }
.note > div { background: var(--bg); padding: 14px 16px; font-size: 13.5px; line-height: 1.55; color: var(--ink-2); }
.note b { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 10.5px; letter-spacing: 0.1em; color: var(--ink); margin-bottom: 6px; text-transform: uppercase; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0ms !important; } }
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><span class="led on"></span>ENG / EXPLORERS</div>
  <nav class="modes" role="tablist" aria-label="Explorer mode" id="modes"></nav>
  <div class="right">
    <button class="key" id="data" aria-pressed="false" title="Toggle a 12-project stress test"><span class="led"></span>Load 12</button>
    <button class="key" id="scheme" aria-pressed="false" title="Light / dark (L / D)"><span class="led"></span>Dark</button>
    <a class="key" href="/prototypes/eng-synth-system.html">System ↗</a>
  </div>
</header>

<main>
  <div class="head">
    <div><span class="label" id="modeNo"></span><h1 id="modeTitle"></h1><p id="modeBlurb"></p></div>
    <div class="score" id="score" aria-label="Assessment"></div>
  </div>
  <div id="stage"></div>
  <div class="note" id="note"></div>
</main>

<script>
/* ======================= data ======================= */
const NOW = 2026.85;
const REAL = [

function viewportHTML(cls = '') {
  return `<div class="vp ${cls}">
    <div class="vp-media"><div class="vp-hud"><span class="ch"></span><span class="pv">PREVIEW</span></div></div>
    <div class="vp-meta">

      <h2 class="vp-title"></h2>
      <p class="vp-desc"></p>
      <div class="vp-spec label"></div>
      <div class="vp-acts"><button class="key dark"><span class="led on"></span>Open case study</button><a class="key" target="_blank" rel="noopener">Repo ↗</a></div>
    </div>
    <span class="corner c-tl"></span><span class="corner c-br"></span>
  </div>`;
}
function mountViewport(root) {
  const vp = root.querySelector('.vp');
  const media = vp.querySelector('.vp-media');
  let shown = -1;
  return function set(i, { preview = false } = {}) {
    vp.classList.toggle('is-preview', preview);
    if (i === shown) return;
    shown = i;
    const p = state.items[i];
    vp.querySelector('.ch').innerHTML = `CH <em>${n2(i)}</em>/${total()}`;
    vp.querySelector('.vp-eyebrow').innerHTML = `<span>${n2(i)}</span><span class="sep"></span><span>${p.yrs}</span><span class="sep"></span><span class="led ${p.st === 'SHIPPED' ? 'ok' : 'on'}"></span><span>${p.st}</span>${p.also ? `<span class="sep"></span><span>ALSO IN ${p.also.toUpperCase()}</span>` : ''}`;
    vp.querySelector('.vp-title').innerHTML = `${p.name}<small>${p.kind}</small>`;
    vp.querySelector('.vp-desc').textContent = p.d;
    vp.querySelector('.vp-spec').innerHTML = p.tech.map((t, k) => `<div>STACK ${n2(k + 1)}<b>${t}</b></div>`).join('');
    vp.querySelector('a.key').href = p.repo;
    const layer = document.createElement('div');
    layer.className = 'vp-layer';
    layer.innerHTML = p.video && !reduced()
      ? `<video src="${p.video}" poster="${p.img}" muted loop playsinline autoplay></video>`
      : `<img src="${p.img}" alt="">`;
    media.insertBefore(layer, media.querySelector('.vp-hud'));
    const prev = [...media.querySelectorAll('.vp-layer')].filter((l) => l !== layer);
    if (reduced() || !prev.length) { prev.forEach((l) => l.remove()); return; }
    layer.animate([{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)' }], { duration: 240, easing: 'cubic-bezier(.45,0,.15,1)' })
      .finished.then(() => prev.forEach((l) => l.remove())).catch(() => {});
  };
}

        if (f < 0 || f > 1) { tl.classList.remove('scrubbing'); return; }
        tl.classList.add('scrubbing');
        const y = Y0 + f * (Y1 - Y0);
        head.style.left = `${f * 100}%`;
        head.firstElementChild.textContent = `Q${Math.floor((y % 1) * 4) + 1} '${String(Math.floor(y)).slice(2)}`;
        lanes.querySelectorAll('.tl-lane').forEach((l) => { const p = state.items[+l.dataset.i]; l.classList.toggle('lit', y >= p.s && y <= (p.e ?? NOW)); });
        const lane = e.target.closest('.tl-lane'); if (lane) setVP(+lane.dataset.i, { preview: +lane.dataset.i !== state.sel });
      }, { signal: sig });
      lanes.addEventListener('pointerleave', () => { tl.classList.remove('scrubbing'); lanes.querySelectorAll('.lit').forEach((l) => l.classList.remove('lit')); setVP(state.sel); }, { signal: sig });
      lanes.addEventListener('click', (e) => { const l = e.target.closest('.tl-lane'); if (l) pin(+l.dataset.i, true); }, { signal: sig });
      lanes.addEventListener('keydown', (e) => { if (e.key === 'ArrowDown') { e.preventDefault(); pin(Math.min(state.items.length - 1, state.sel + 1), true); } if (e.key === 'ArrowUp') { e.preventDefault(); pin(Math.max(0, state.sel - 1), true); } }, { signal: sig });
    },
  },
];
const CRIT = ['Scan at rest', 'Fixed targets', 'Keyboard', 'Touch', 'Scales 12+', 'Character'];
const ACC = [1, 0, 1, 1, 0, 2];

/* ======================= shell ======================= */
const stage = document.getElementById('stage');
const modesEl = document.getElementById('modes');
modesEl.innerHTML = MODES.map((m, i) => `<button role="tab" aria-selected="false" data-m="${i}"><kbd>${i + 1}</kbd>${m.key}</button>`).join('');
let ctl = null;
function render() {
  ctl?.abort(); ctl = new AbortController();
  const m = MODES[state.mode];
  state.sel = Math.min(Math.max(0, state.sel), state.items.length - 1);
  modesEl.querySelectorAll('button').forEach((b) => b.setAttribute('aria-selected', +b.dataset.m === state.mode));
  document.getElementById('modeNo').textContent = `MODE ${state.mode + 1} / ${MODES.length} · ${state.items.length} PROJECTS`;
  document.getElementById('modeTitle').textContent = m.title;
  document.getElementById('modeBlurb').textContent = m.blurb;
  document.getElementById('score').innerHTML = `<span class="label" style="grid-column:1/-1;display:flex;justify-content:space-between"><span>assessment</span><span>▮ this · ▯ accordion today</span></span>` +
    CRIT.map((c, k) => `<span class="label">${c}</span><span class="bars" title="accordion: ${ACC[k]}/3">${[0, 1, 2].map((j) => `<i class="${j < m.score[k] ? 'on' : ''}" style="${j < ACC[k] ? 'outline:1px solid var(--signal);outline-offset:-1px' : ''}"></i>`).join('')}</span>`).join('');
  document.getElementById('note').innerHTML = m.notes.map(([h, t]) => `<div><b>${h}</b>${t}</div>`).join('');
  m.mount(stage, ctl.signal);
}
modesEl.addEventListener('click', (e) => { const b = e.target.closest('[data-m]'); if (b) { state.mode = +b.dataset.m; render(); } });
document.getElementById('scheme').addEventListener('click', (e) => { state.dark = !state.dark; document.documentElement.dataset.scheme = state.dark ? 'dark' : 'light'; e.currentTarget.setAttribute('aria-pressed', state.dark); });
document.getElementById('data').addEventListener('click', (e) => { const big = state.items === REAL; state.items = big ? [...REAL, ...FIX] : REAL; e.currentTarget.setAttribute('aria-pressed', big); render(); });
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const n = +e.key; if (n >= 1 && n <= MODES.length) { state.mode = n - 1; render(); }
  if (e.key.toLowerCase() === 'd') document.getElementById('scheme').click();
});
const hashMode = MODES.findIndex((m) => `#${m.key.toLowerCase()}` === location.hash);
if (hashMode >= 0) state.mode = hashMode;
render();
</script>
</body>
