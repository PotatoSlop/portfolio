<!doctype html>
<!--
  PROTOTYPE: photo titles + locations. Throwaway ideation file, not wired into
  Astro. Open via your dev server at /prototypes/photo-captions.html (asset paths
  are relative, so the web-sized photos load there or straight from disk).

  Axes (dark panel bottom-left, or the hash #cap/method/type/view):
    tiles     always shown · on hover only           (03 masonry + 04 grid)
    contrast  gradient scrim · frosted label · text shadow · caption below
    type      display (Dela Gothic) · sans (Archivo)
    full view below · side panel · overlay · wall label · top bar
  Titles and locations are the real ones from src/data/photos.ts.
-->
<html lang="en" data-cap="always" data-method="scrim" data-type="display" data-view="below">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photo captions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Dela+Gothic+One&display=swap" rel="stylesheet" />
    <style>
      :root {
        --paper: #f3efe6;
        --card: #ffffff;
        --ink: #16233a;
        --muted: #6c7183;
        --line: rgba(20, 18, 12, 0.12);
        --accent: #f5a045;
        --accent-deep: #b5611b;
        --navy: #0e1a30;
        --cream: #e9e2d2;
        --navy-line: rgba(233, 226, 210, 0.16);
        --shadow: 28px 40px 60px -28px rgba(30, 24, 14, 0.45);
        --edge: 74px;
        --ease: cubic-bezier(0.075, 0.82, 0.165, 1);
        --f-title: 'Dela Gothic One', sans-serif;
        --f-body: 'Archivo', system-ui, sans-serif;
      }
      @media (max-width: 768px) {
        :root {
          --edge: 16px;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--f-body);
        -webkit-font-smoothing: antialiased;
      }
      img {
        display: block;
      }

      /* ---------- Sections (stand-ins for design.astro 03 + 04) ---------- */
      .sec {
        padding: 8vh var(--edge);
      }
      .sec-head {
        display: flex;
        align-items: baseline;
        gap: 16px;
        margin-bottom: 20px;
      }
      .sec-head .n {
        font: 600 15px/1 var(--f-body);
        letter-spacing: 0.08em;
        color: var(--accent-deep);
      }
      .sec-head h2 {
        margin: 0;
        font: 400 clamp(24px, 2.7vw, 54px) / 1 var(--f-title);
        text-transform: uppercase;
      }
      .sec--grid {
        background: var(--navy);
        color: var(--cream);
      }
      .sec--grid .sec-head .n {
        color: var(--accent);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 3vh;
      }
      .chips span {
        padding: 7px 16px;
        border: 1px solid var(--navy-line);
        border-radius: 5px;
        background: rgba(233, 226, 210, 0.05);
        font: 600 13px/1 var(--f-body);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .chips span.on {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--ink);
      }

      .masonry {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 20px;
        align-items: start;
      }
      .m-col {
        display: flex;
        flex-direction: column;
        gap: 20px;
        min-width: 0;
      }
      .grid {
        columns: 4;
        column-gap: 18px;
      }
      .grid .tile {
        margin-bottom: 18px;
        break-inside: avoid;
      }
      @media (max-width: 900px) {
        .masonry {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .grid {
          columns: 2;
        }
      }

      /* ---------- Tiles (shared by 03 + 04) ---------- */
      .tile {
        position: relative;
        display: block;
        width: 100%;
        margin: 0;
        padding: 0;
        border-radius: 5px;
        overflow: hidden;
        font: inherit;
        text-align: left;
        cursor: zoom-in;
        transition: box-shadow 0.5s var(--ease), transform 0.4s var(--ease);
      }
      .m-col .tile {
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
      }
      .grid .tile {
        border: 1px solid var(--navy-line);
        background: #152541;
        color: var(--cream);
      }
      .tile:hover {
        transform: scale(1.04);
        z-index: 2;
      }
      .m-col .tile:hover {
        box-shadow: var(--shadow);
      }
      .grid .tile:hover {
        box-shadow: 0 24px 44px -22px rgba(0, 0, 0, 0.7);
      }
      .tile:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        z-index: 2;
      }
      .media {
        position: relative;
        overflow: hidden;
        background: linear-gradient(150deg, #e9e3d6, #d5ccb9);
      }
      .grid .media {
        background: linear-gradient(150deg, #1b2c4c, #122038);
      }
      .media.is-landscape {
        aspect-ratio: 3 / 2;
      }
      .media.is-portrait {
        aspect-ratio: 3 / 4;
      }
      .media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.6s var(--ease);
      }
      .tile:hover .media img {
        transform: scale(1.05);
      }
      .g-tag {
        position: absolute;
        z-index: 3;
        top: 8px;
        right: 8px;
        padding: 3px 8px;
        border-radius: 999px;
        border: 1px solid rgba(233, 226, 210, 0.14);
        background: rgba(8, 14, 26, 0.72);
        color: var(--accent);
        font: 600 10px/1.3 var(--f-body);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      /* ---------- Caption: content ---------- */
      .cap {
        z-index: 2;
        display: flex;
        flex-direction: column;
        gap: 4px;
        pointer-events: none;
      }
      .cap__t {
        font-weight: 400;
        line-height: 1.1;
      }
      .cap__l {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font: 600 10.5px/1.2 var(--f-body);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.85;
      }
      .cap__l svg {
        flex: 0 0 auto;
        width: 10px;
        height: 10px;
        fill: currentColor;
      }
      [data-type='display'] .cap__t {
        font-family: var(--f-title);
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.01em;
      }
      [data-type='sans'] .cap__t {
        font: 600 15px/1.2 var(--f-body);
        letter-spacing: 0;
      }

      /* ---------- Caption: contrast methods ---------- */
      /* Overlay methods (everything but "below") sit on the photo. */
      html:not([data-method='below']) .cap {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 11px;
        color: #f3efe6;
      }
      /* 1. Gradient scrim — a short, soft navy fade only under the text. */
      [data-method='scrim'] .media::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 1;
        background: linear-gradient(0deg, rgba(8, 14, 26, 0.74) 0%, rgba(8, 14, 26, 0.38) 22%, rgba(8, 14, 26, 0) 44%);
        transition: opacity 0.35s ease;
      }
      /* 2. Frosted label — a compact glass chip, the photo stays untouched around it. */
      [data-method='frost'] .cap {
        right: auto;
        left: 10px;
        bottom: 10px;
        max-width: calc(100% - 20px);
        padding: 7px 10px 8px;
        border: 1px solid rgba(233, 226, 210, 0.18);
        border-radius: 4px;
        background: rgba(14, 26, 48, 0.5);
        -webkit-backdrop-filter: blur(12px) saturate(1.2);
        backdrop-filter: blur(12px) saturate(1.2);
      }
      /* 3. Text shadow — no shape at all; the lightest touch, weakest on bright skies. */
      [data-method='shadow'] .cap {
        text-shadow:
          0 1px 2px rgba(0, 0, 0, 0.55),
          0 0 14px rgba(0, 0, 0, 0.45);
      }
      [data-method='shadow'] .cap__l svg {
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.6));
      }
      /* 4. Caption below — off the photo, on the card itself. Guaranteed contrast. */
      [data-method='below'] .cap {
        position: static;
        padding: 11px 12px 12px;
      }
      [data-method='below'] .m-col .cap__l {
        color: var(--muted);
        opacity: 1;
      }

      /* ---------- Hover-only reveal ---------- */
      [data-cap='hover']:not([data-method='below']) .cap {
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 0.35s ease, transform 0.45s var(--ease);
      }
      [data-cap='hover'][data-method='scrim'] .media::after {
        opacity: 0;
      }
      [data-cap='hover']:not([data-method='below']) .tile:is(:hover, :focus-visible) .cap {
        opacity: 1;
        transform: none;
      }
      [data-cap='hover'][data-method='scrim'] .tile:is(:hover, :focus-visible) .media::after {
        opacity: 1;
      }
      /* Touch has no hover: captions just show. */
      @media (hover: none) {
        [data-cap='hover'] .cap,
        [data-cap='hover'] .media::after {
          opacity: 1 !important;
          transform: none !important;
        }
      }

      /* ======================================================================
         FULL VIEW — one caption element, placed by data-view
         ====================================================================== */
      .lb {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        max-width: none;
        max-height: none;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--cream);
        overflow: hidden;
      }
      .lb::backdrop {
        background: rgba(8, 14, 26, 0.97);
      }
      .lb[open] {
        display: grid;
        place-items: center;
        animation: lbIn 0.3s ease;
      }
      @keyframes lbIn {
        from {
          opacity: 0;
        }
      }
      .lb__fig {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
        margin: 0;
      }
      .lb__img {
        width: auto;
        height: auto;
        max-width: min(88vw, 1600px);
        max-height: calc(100dvh - 170px);
        border-radius: 3px;
        box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.9);
        user-select: none;
      }
      .lb__cap {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: end;
        column-gap: 24px;
        row-gap: 6px;
        width: 100%;
        transition: opacity 0.5s ease;
      }
      .lb__t {
        grid-column: 1;
        margin: 0;
        font: 400 22px/1.05 var(--f-title);
        text-transform: uppercase;
      }
      [data-type='sans'] .lb__t {
        font: 600 22px/1.2 var(--f-body);
        text-transform: none;
      }
      .lb__l {
        grid-column: 1;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font: 600 12px/1.2 var(--f-body);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(233, 226, 210, 0.75);
      }
      .lb__l svg {
        width: 11px;
        height: 11px;
        fill: currentColor;
      }
      .lb__n {
        grid-column: 2;
        grid-row: 1 / 3;
        align-self: end;
        font: 600 12px/1 var(--f-body);
        letter-spacing: 0.12em;
        font-variant-numeric: tabular-nums;
        color: rgba(233, 226, 210, 0.6);
      }

      /* 1. Below — a caption line under the photo, aligned to its edges. */
      [data-view='below'] .lb__fig {
        width: fit-content;
      }

      /* 2. Side panel — a placard beside the photo. */
      [data-view='side'] .lb__fig {
        flex-direction: row;
        align-items: center;
        gap: clamp(28px, 4vw, 56px);
      }
      [data-view='side'] .lb__img {
        max-width: min(calc(100vw - 280px - 200px), 1400px);
        max-height: calc(100dvh - 120px);
      }
      [data-view='side'] .lb__cap {
        width: 240px;
        grid-template-columns: 1fr;
        align-content: center;
        padding-left: 20px;
        border-left: 1px solid rgba(233, 226, 210, 0.2);
      }
      [data-view='side'] .lb__n {
        grid-column: 1;
        grid-row: 1;
        margin-bottom: 14px;
      }
      [data-view='side'] .lb__t {
        font-size: 30px;
      }
      [data-view='side'] .lb__t,
      [data-view='side'] .lb__l {
        grid-column: 1;
      }

      /* 3. Overlay — on the photo itself, fading out when the pointer rests. */
      [data-view='overlay'] .lb__img {
        max-height: calc(100dvh - 120px);
      }
      [data-view='overlay'] .lb__cap {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 60px 22px 18px;
        border-radius: 0 0 3px 3px;
        background: linear-gradient(0deg, rgba(8, 14, 26, 0.78), rgba(8, 14, 26, 0));
      }
      [data-view='overlay'] .lb.is-idle .lb__cap {
        opacity: 0;
      }

      /* 4. Wall label — a museum placard fixed in the screen corner. */
      /* Lift the photo so the placard gets its own band and never covers a corner. */
      [data-view='wall'] .lb__img {
        max-height: calc(100dvh - 210px);
        margin-bottom: 84px;
      }
      [data-view='wall'] .lb__cap {
        position: fixed;
        left: 24px;
        bottom: 24px;
        width: auto;
        min-width: 220px;
        max-width: 300px;
        padding: 14px 16px 15px;
        border-radius: 4px;
        background: #f3efe6;
        color: var(--ink);
        box-shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.7);
      }
      [data-view='wall'] .lb__t {
        font-size: 17px;
      }
      [data-view='wall'] .lb__l {
        color: var(--muted);
      }
      [data-view='wall'] .lb__n {
        color: var(--accent-deep);
      }

      /* 5. Top bar — title in the chrome row, out of the photo's way. */
      [data-view='top'] .lb__img {
        max-height: calc(100dvh - 140px);
        margin-top: 30px;
      }
      [data-view='top'] .lb__cap {
        position: fixed;
        top: 20px;
        left: 24px;
        right: 84px;
        width: auto;
        display: flex;
        align-items: baseline;
        gap: 14px;
      }
      [data-view='top'] .lb__t {
        font-size: 18px;
      }
      [data-view='top'] .lb__n {
        margin-left: auto;
      }

      /* Controls (same as the real PhotoLightbox) */
      .lb__btn {
        position: fixed;
        z-index: 5;
        isolation: isolate;
        overflow: hidden;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 1px solid rgba(233, 226, 210, 0.2);
        border-radius: 5px;
        background: rgba(22, 35, 58, 0.72);
        color: var(--cream);
        cursor: pointer;
        transition: color 0.3s, border-color 0.3s;
      }
      .lb__btn::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        background: var(--accent);
        transform: translateY(100%);
        transition: transform 0.35s var(--ease);
      }
      .lb__btn:hover {
        color: var(--ink);
        border-color: var(--accent);
      }
      .lb__btn:hover::before {
        transform: none;
      }
      .lb__btn svg {
        width: 24px;
        height: 24px;
        fill: currentColor;
      }
      .lb__close {
        top: 16px;
        right: 16px;
      }
      .lb__prev,
      .lb__next {
        top: 50%;
        margin-top: -22px;
      }
      .lb__prev {
        left: 16px;
      }
      .lb__next {
        right: 16px;
      }
      @media (max-width: 900px) {
        /* No room for a side panel: fall back to below. */
        [data-view='side'] .lb__fig {
          flex-direction: column;
          align-items: flex-start;
        }
        [data-view='side'] .lb__img {
          max-width: 92vw;
          max-height: calc(100dvh - 200px);
        }
        [data-view='side'] .lb__cap {
          width: 100%;
          padding-left: 0;
          border-left: 0;
        }
      }

      /* ---------- Prototype panel (tooling) ---------- */
      .proto {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 100;
        width: min(380px, calc(100vw - 32px));
        padding: 12px 12px 10px;
        border-radius: 10px;
        background: #111317;
        color: #e8e8ea;
        font: 500 12px/1.45 system-ui, sans-serif;
        box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.5);
      }
      .proto b {
        display: block;
        margin: 0 0 6px;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #9a9ca3;
      }
      .proto-seg {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 10px;
      }
      .proto button {
        flex: 1 1 auto;
        padding: 7px 8px;
        border: 1px solid #2c2f36;
        border-radius: 6px;
        background: #1a1c21;
        color: #e8e8ea;
        font: 600 11px/1 system-ui, sans-serif;
        cursor: pointer;
      }
      .proto button[aria-pressed='true'] {
        background: #f5a045;
        border-color: #f5a045;
        color: #111317;
      }
      /* Top centre, clear of every caption position; the top-bar variant owns the
         top row, so there it drops to the bottom centre. */
      .lb__proto {
        position: fixed;
        z-index: 6;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        flex-wrap: nowrap;
        margin: 0;
        padding: 6px;
        border-radius: 8px;
        background: #111317;
        box-shadow: 0 12px 30px -12px rgba(0, 0, 0, 0.6);
      }
      .lb__proto button {
        padding: 7px 9px;
        border: 1px solid #2c2f36;
        border-radius: 6px;
        background: #1a1c21;
        color: #e8e8ea;
        font: 600 11px/1 system-ui, sans-serif;
        cursor: pointer;
      }
      .lb__proto button[aria-pressed='true'] {
        background: #f5a045;
        border-color: #f5a045;
        color: #111317;
      }
      [data-view='top'] .lb__proto {
        top: auto;
        bottom: 16px;
      }
      .proto .proto-open {
        width: 100%;
        background: #2a2d34;
      }
      .proto-note {
        margin: 2px 0 10px;
        color: #a9abb2;
        font-size: 11px;
      }
      .proto-min {
        position: absolute;
        top: 8px;
        right: 10px;
        flex: 0 0 auto !important;
        padding: 2px 7px !important;
      }
      .proto.is-min .proto-body {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="sec" aria-label="Photography">
        <div class="sec-head"><span class="n">03</span><h2>Photography</h2></div>
        <div class="masonry" data-masonry></div>
      </section>
      <section class="sec sec--grid" aria-label="All work">
        <div class="sec-head"><span class="n">04</span><h2>All work</h2></div>
        <div class="chips" aria-hidden="true"><span>All</span><span>3D</span><span>UI/UX</span><span class="on">Photography</span></div>
        <div class="grid" data-grid></div>
      </section>
    </main>

    <dialog class="lb" id="lb" aria-label="Photograph viewer">
      <figure class="lb__fig" data-lb-fig>
        <img class="lb__img" alt="" />
        <figcaption class="lb__cap">
          <p class="lb__t" data-lb-t></p>
          <span class="lb__l"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z" /></svg><span data-lb-l></span></span>
          <span class="lb__n" data-lb-n></span>
        </figcaption>
      </figure>
      <button class="lb__btn lb__close" type="button" data-lb-close aria-label="Close viewer"><svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" /></svg></button>
      <button class="lb__btn lb__prev" type="button" data-lb-step="-1" aria-label="Previous photograph"><svg viewBox="0 0 24 24"><path d="M15.41 16.59 10.83 12l4.58-4.59L14 6l-6 6 6 6z" /></svg></button>
      <button class="lb__btn lb__next" type="button" data-lb-step="1" aria-label="Next photograph"><svg viewBox="0 0 24 24"><path d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6z" /></svg></button>
      <!-- Prototype tooling: the page panel is inert behind a modal dialog, so the
           viewer carries its own position switcher (keys 1–5 work too). -->
      <div class="proto-seg lb__proto" data-axis="view" aria-label="Title position">
        <button type="button" data-val="below">1 Below</button>
        <button type="button" data-val="side">2 Side</button>
        <button type="button" data-val="overlay">3 Overlay</button>
        <button type="button" data-val="wall">4 Wall</button>
        <button type="button" data-val="top">5 Top</button>
      </div>
    </dialog>

    <aside class="proto" aria-label="Prototype controls">
      <button class="proto-min" type="button" data-min aria-label="Collapse panel">–</button>
      <div class="proto-body">
        <b>Tile captions</b>
        <div class="proto-seg" data-axis="cap">
          <button type="button" data-val="always">Always shown</button>
          <button type="button" data-val="hover">On hover only</button>
        </div>
        <b>Contrast</b>
        <div class="proto-seg" data-axis="method">
          <button type="button" data-val="scrim">Gradient</button>
          <button type="button" data-val="frost">Frosted label</button>
          <button type="button" data-val="shadow">Text shadow</button>
          <button type="button" data-val="below">Below photo</button>
        </div>
        <b>Title type</b>
        <div class="proto-seg" data-axis="type">
          <button type="button" data-val="display">Display</button>
          <button type="button" data-val="sans">Sans</button>
        </div>
        <b>Full view title</b>
        <div class="proto-seg" data-axis="view">
          <button type="button" data-val="below">Below</button>
          <button type="button" data-val="side">Side panel</button>
          <button type="button" data-val="overlay">Overlay</button>
          <button type="button" data-val="wall">Wall label</button>
          <button type="button" data-val="top">Top bar</button>
        </div>
        <p class="proto-note" data-note></p>
        <button type="button" class="proto-open" data-open>Open full view</button>
      </div>
    </aside>

    <script>
      // Real titles/locations (src/data/photos.ts). Order + aspects match the
      // build's interleave (src/lib/photos.ts).
      const RAW = [
        ['sample-horz-1', 'Lanterns', 'Jiufen, Taiwan', 'landscape'],
        ['sample-horz-2', 'Sounds under the Shade', 'Seattle, Washington', 'landscape'],
        ['sample-horz-3', 'Fairy Foliage', 'Queens, New York', 'landscape'],
        ['sample-horz-4', "Waiting for Adel's", 'Manhattan, New York', 'landscape'],
        ['sample-horz-5', 'Temple in the fog', 'Jiufen, Taiwan', 'landscape'],
        ['sample-horz-6', 'Golden Egg', 'Taipei, Taiwan', 'landscape'],
        ['sample-horz-7', 'Zipline Temple', 'Jiufen, Taiwan', 'landscape'],
        ['sample-horz-8', 'Siesta', 'Jiufen, Taiwan', 'landscape'],
        ['sample-horz-9', 'Seeking V formation', 'Boston, Massachusetts', 'landscape'],
        ['sample-vert-1', 'Heat Lamp', 'Manhattan, New York', 'portrait'],
        ['sample-vert-2', 'Golden Corner', 'Boston, Massachusetts', 'portrait'],
        ['sample-vert-3', 'Hidden Message', 'Queens, New York', 'portrait'],
        ['sample-vert-4', 'Corner Cart', 'Queens, New York', 'portrait'],
        ['sample-vert-5', 'Queue', 'Queens, New York', 'portrait'],
        ['sample-vert-6', 'Oyakodon', 'Shibuya, Tokyo', 'portrait'],
        ['sample-vert-7', 'Wispy Skies', 'Queens, New York', 'portrait'],
        ['sample-vert-8', 'Tower', 'Boston, Massachusetts', 'portrait'],
        ['sample-vert-9', 'Peek', 'Queens, New York', 'portrait'],
        ['sample-vert-10', 'Emperial', 'Asakusa, Tokyo', 'portrait'],
        ['sample-vert-11', 'Capacity', 'Marina Square, Singapore', 'portrait'],
        ['sample-vert-12', 'Shoulder Surfing', 'Seattle, Washington', 'portrait'],
        ['sample-vert-13', 'Still Steel', 'Brooklyn, New York', 'portrait'],
      ].map(([slug, title, location, aspect]) => ({
        slug,
        title,
        location,
        aspect,
        thumb: `../Assets/Photography/web/thumb/${slug}.webp`,
        full: `../Assets/Photography/web/large/${slug}.webp`,
      }));

      // Same interleave as src/lib/photos.ts.
      function interleave(list) {
        const wide = list.filter((p) => p.aspect === 'landscape');
        const rest = list.filter((p) => p.aspect !== 'landscape');
        const [few, many] = wide.length <= rest.length ? [wide, rest] : [rest, wide];
        const out = [];
        const step = list.length / few.length;
        for (let i = 0, f = 0, m = 0, next = step / 2; i < list.length; i++) {
          if (f < few.length && (i >= next || m >= many.length)) {
            out.push(few[f++]);
            next += step;
          } else out.push(many[m++]);
        }
        return out;
      }
      const PHOTOS = interleave(RAW);

      const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
      const PIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>';
      const tile = (p, i, tag) =>
        `<button type="button" class="tile" data-photo="${i}" aria-label="Open photo: ${esc(p.title)}, ${esc(p.location)}">` +
        `<div class="media is-${p.aspect}"><img src="${p.thumb}" alt="" loading="lazy" decoding="async"></div>` +
        (tag ? '<span class="g-tag">Photo</span>' : '') +
        `<span class="cap"><span class="cap__t">${esc(p.title)}</span><span class="cap__l">${PIN}${esc(p.location)}</span></span>` +
        `</button>`;

      // 03 masonry: round-robin into 4 columns (static here — the real one drifts).
      const COLS = 4;
      const cols = Array.from({ length: COLS }, () => []);
      PHOTOS.forEach((p, i) => cols[i % COLS].push(tile(p, i, false)));
      document.querySelector('[data-masonry]').innerHTML = cols.map((c) => `<div class="m-col">${c.join('')}</div>`).join('');
      // 04 grid: multicolumn, with the corner "Photo" chip.
      document.querySelector('[data-grid]').innerHTML = PHOTOS.map((p, i) => tile(p, i, true)).join('');

      // ---------- Full view ----------
      const lb = document.getElementById('lb');
      const img = lb.querySelector('.lb__img');
      const tEl = lb.querySelector('[data-lb-t]');
      const lEl = lb.querySelector('[data-lb-l]');
      const nEl = lb.querySelector('[data-lb-n]');
      const pad = (n) => String(n).padStart(2, '0');
      let idx = 0;
      let idleTimer = 0;
      const show = (i) => {
        idx = (i + PHOTOS.length) % PHOTOS.length;
        const p = PHOTOS[idx];
        img.src = p.full;
        img.alt = `${p.title}, ${p.location}`;
        tEl.textContent = p.title;
        lEl.textContent = p.location;
        nEl.textContent = `${pad(idx + 1)} / ${pad(PHOTOS.length)}`;
        wake();
      };
      // Overlay variant: the caption fades once the pointer rests for 2.5s.
      const wake = () => {
        lb.classList.remove('is-idle');
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => lb.classList.add('is-idle'), 2500);
      };
      const open = (i) => {
        show(i);
        if (!lb.open) lb.showModal();
      };
      document.addEventListener('click', (e) => {
        const t = e.target.closest('[data-photo]');
        if (t) open(Number(t.dataset.photo));
      });
      lb.addEventListener('pointermove', wake);
      lb.addEventListener('click', (e) => {
        const step = e.target.closest('[data-lb-step]');
        if (step) return show(idx + Number(step.dataset.lbStep));
        if (e.target.closest('[data-lb-close]')) return lb.close();
        if (e.target === lb) lb.close();
      });
      lb.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') show(idx + 1);
        if (e.key === 'ArrowLeft') show(idx - 1);
      });

      // ---------- Prototype controls ----------
      const root = document.documentElement;
      const NOTES = {
        scrim: 'Gradient: a short navy fade under the text only. Reads on any photo, but darkens the bottom fifth.',
        frost: 'Frosted label: a compact glass chip. The photo stays untouched around it; busier, but very legible.',
        shadow: 'Text shadow: no shape at all, the lightest touch. Weakest over bright skies and white walls.',
        below: 'Below photo: the caption sits on the card, off the image. Guaranteed contrast; hover-only does not apply.',
      };
      const VIEW_NOTES = {
        below: 'Full view, below: caption line aligned to the photo edges, counter on the right.',
        side: 'Full view, side panel: a placard beside the photo (falls back to below under 900px).',
        overlay: 'Full view, overlay: on the photo with a fade; hides after 2.5s of stillness, back on pointer move.',
        wall: 'Full view, wall label: a cream museum placard fixed bottom-left, independent of the photo.',
        top: 'Full view, top bar: title in the chrome row beside close, the photo gets the whole stage.',
      };
      const note = document.querySelector('[data-note]');
      const paintNote = () => (note.textContent = `${NOTES[root.dataset.method]} ${VIEW_NOTES[root.dataset.view]}`);
      const AXES = ['cap', 'method', 'type', 'view'];
      function set(axis, val, push = true) {
        root.dataset[axis] = val;
        document.querySelectorAll(`[data-axis="${axis}"] button`).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.val === val)));
        if (push) history.replaceState(null, '', '#' + AXES.map((a) => root.dataset[a]).join('/'));
        paintNote();
        if (axis === 'view' && lb.open) wake();
      }
      document.querySelectorAll('[data-axis]').forEach((seg) => seg.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => set(seg.dataset.axis, b.dataset.val))));
      document.querySelector('[data-open]').addEventListener('click', () => open(0));
      document.querySelector('[data-min]').addEventListener('click', (e) => {
        const p = document.querySelector('.proto');
        p.classList.toggle('is-min');
        e.currentTarget.textContent = p.classList.contains('is-min') ? '+' : '–';
      });
      // Keys 1–5 switch the title position while the viewer is open.
      lb.addEventListener('keydown', (e) => {
        const v = ['below', 'side', 'overlay', 'wall', 'top'][Number(e.key) - 1];
        if (v) set('view', v);
      });
      const parts = location.hash.slice(1).split('/');
      AXES.forEach((a, i) => {
        const ok = [...document.querySelectorAll(`[data-axis="${a}"] button`)].map((b) => b.dataset.val);
        set(a, ok.includes(parts[i]) ? parts[i] : root.dataset[a], false);
      });
    </script>
  </body>
</html>
